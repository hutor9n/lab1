name: CI

on:
  push:
    branches:
      - main
      - 'feature/*'
      - 'bugfix/*'
    paths-ignore:
      - 'docs/**'
      - 'README.md'

jobs:
  # ---------------------------------------------------------
  # Job 1: Збирання та запуск модульних тестів
  # ---------------------------------------------------------
  build-n-test:
    name: Build and Unit Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          pytest --junitxml=results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: results.xml

  # ---------------------------------------------------------
  # Job 2: Збирання та пуш образу Backend API
  # ---------------------------------------------------------
  docker-backend:
    name: Package Backend API Image
    needs: build-n-test
    uses: ./.github/workflows/docker-pack-n-push.yml
    with:
      image_name: 'hut0r9n/lab1-api'
      image_tag: 'latest'
      dockerfile: 'Dockerfile'
      build_context: '.'
      push_to_hub: ${{ github.ref == 'refs/heads/main' }}
    secrets: inherit

  # ---------------------------------------------------------
  # Job 3: Збирання та пуш образу Frontend
  # ---------------------------------------------------------
  docker-frontend:
    name: Package Frontend Image
    needs: build-n-test
    uses: ./.github/workflows/docker-pack-n-push.yml
    with:
      image_name: 'hut0r9n/lab1-frontend'
      image_tag: 'latest'
      dockerfile: 'frontend/Dockerfile'
      build_context: '.'
      push_to_hub: ${{ github.ref == 'refs/heads/main' }}
    secrets: inherit

  # ---------------------------------------------------------
  # Job 4: Збирання та пуш образу Migration Job
  # ---------------------------------------------------------
  docker-migration:
    name: Package Migration Job Image
    needs: build-n-test
    uses: ./.github/workflows/docker-pack-n-push.yml
    with:
      image_name: 'hut0r9n/lab1-migration'
      image_tag: 'latest'
      dockerfile: 'Dockerfile.migration'
      build_context: '.'
      push_to_hub: ${{ github.ref == 'refs/heads/main' }}
    secrets: inherit

  # ---------------------------------------------------------
  # Job 5: Лінтинг, пакування та вивантаження Helm Chart
  # ---------------------------------------------------------
  helm-package:
    name: Lint and Package Helm Chart
    needs: build-n-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.16.2'

      - name: Lint Helm Chart
        run: |
          helm lint k8s/webapp

      - name: Package Helm Chart
        run: |
          mkdir -p dist
          helm package k8s/webapp --destination dist

      - name: Upload Helm Chart Artifact
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart-webapp
          path: dist/*.tgz
          retention-days: 7

      - name: Create Kubernetes test cluster
        uses: helm/kind-action@v1.12.0
        with:
          cluster_name: lab4-ci

      - name: Deploy the packaged chart with the images from this checkout
        run: |
          docker build -t lab4-api:ci .
          docker build -t lab4-frontend:ci -f frontend/Dockerfile .
          docker build -t lab4-migration:ci -f Dockerfile.migration .
          kind load docker-image --name lab4-ci lab4-api:ci lab4-frontend:ci lab4-migration:ci
          helm upgrade --install lab dist/*.tgz \
            --namespace webapp-lab --create-namespace \
            --set api.image.repository=lab4-api,api.image.tag=ci,api.image.pullPolicy=Never \
            --set frontend.image.repository=lab4-frontend,frontend.image.tag=ci,frontend.image.pullPolicy=Never \
            --set migration.image.repository=lab4-migration,migration.image.tag=ci,migration.image.pullPolicy=Never \
            --wait --wait-for-jobs --timeout 5m

      - name: Check the frontend and CRUD through its Nginx proxy
        run: |
          kubectl -n webapp-lab port-forward service/lab-frontend 8080:80 &
          forward_pid=$!
          trap 'kill "$forward_pid"' EXIT

          base_url=http://127.0.0.1:8080
          curl -fsS --retry 10 --retry-connrefused --retry-delay 1 "$base_url/" > index.html
          asset=$(grep -oE '/assets/[^"]+\.js' index.html)
          curl -fsS "$base_url$asset" > /dev/null
          items_url="$base_url/api/items"
          item=$(curl -fsS -H 'Content-Type: application/json' \
            -d '{"name":"CI item","price":10}' "$items_url")
          id=$(jq -er '.id' <<< "$item")
          curl -fsS "$items_url" | jq -e --argjson id "$id" 'any(.[]; .id == $id)'
          curl -fsS -X PUT -H 'Content-Type: application/json' \
            -d '{"name":"Updated CI item","price":12}' "$items_url/$id" |
            jq -e '.name == "Updated CI item" and .price == 12'
          curl -fsS -X DELETE "$items_url/$id"
          curl -fsS "$items_url" | jq -e --argjson id "$id" 'all(.[]; .id != $id)'
