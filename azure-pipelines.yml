trigger:
  branches:
    include:
      - main

pool:
  name: 'Default'

steps:
  # ---------- a. Збирання проєкту ----------
  - script: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt
    displayName: 'Install dependencies'

  # ---------- b. Запуск unit-тестів ----------
  - script: |
      pytest --junitxml=results.xml
    displayName: 'Run unit tests'

  - task: PublishTestResults@2
    inputs:
      testResultsFormat: 'JUnit'
      testResultsFiles: 'results.xml'
    condition: always()
    displayName: 'Publish test results'

  # ---------- c. Збирання Docker-образу ----------
  - task: Docker@2
    displayName: 'Build Docker image'
    inputs:
      containerRegistry: 'dockerhub-connection'       # ← Ім'я Service Connection
      repository: '$(dockerHubUsername)/lab1-api'       # ← Замінити на своє
      command: 'build'
      Dockerfile: '**/Dockerfile'
      tags: |
        latest

  # ---------- d + e. Тегування та публікація ----------
  - task: Docker@2
    displayName: 'Push Docker image to Docker Hub'
    inputs:
      containerRegistry: 'dockerhub-connection'
      repository: '$(dockerHubUsername)/lab1-api'
      command: 'push'
      tags: |
        latest
